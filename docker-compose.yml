services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: competition_platform
      MYSQL_USER: bescuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - db
    restart: always
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=bescuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=competition_platform
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost}
      - UPLOAD_DIR=uploads
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"

volumes:
  db_data:
  uploads_data:
