services:
  db:
    image: mysql:8.0
    restart: always
    networks:
      - traefik-proxy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: competition_platform
      MYSQL_USER: bescuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - db
    restart: always
    networks:
      - traefik-proxy
    volumes:
      - uploads_data:/app/uploads
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=bescuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=competition_platform
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost}
      - UPLOAD_DIR=uploads
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-BESC <noreply@beschimbio.online>}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api/v1
    depends_on:
      - backend
    restart: always
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.besc.rule=Host(`beschimbio.online`) || Host(`www.beschimbio.online`)
      - traefik.http.routers.besc.entrypoints=websecure
      - traefik.http.routers.besc.tls.certresolver=letsencrypt
      - traefik.http.services.besc.loadbalancer.server.port=80
    networks:
      - traefik-proxy

volumes:
  db_data:
  uploads_data:

networks:
  traefik-proxy:
    external: true
